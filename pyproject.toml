[project]
name = "entity-resolution"
version = "0.1.0"
description = "Amazon ML Challenge 2026: business entity resolution across three noisy sources"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "rapidfuzz",
    "lightgbm",
    "polars",
    "pyarrow",
    "tqdm",
]

[dependency-groups]
dev = ["pytest", "ruff", "ipykernel", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entity_resolution"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
